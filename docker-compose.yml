services:
  postgres:
    image: postgres:16-alpine
    container_name: mayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mayan
    ports:
      - "5432:5432"
    volumes:
      - mayan-postgres-data:/var/lib/postgresql/data

volumes:
  mayan-postgres-data:
